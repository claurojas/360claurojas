<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIC 360° Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#10151e;color:#edf1f7;font:15px system-ui}aside{position:fixed;width:235px;height:100vh;background:#18212e;padding:24px;overflow:auto}h1{font-size:25px;margin:0}small{color:#9daec1}nav button{display:block;width:100%;text-align:left;margin:7px 0;background:transparent;color:#bac8d8}button{border:0;border-radius:7px;padding:12px;cursor:pointer;background:#c8f36b;color:#172219;font-weight:700}nav button.active{background:#304158;color:white}main{margin-left:235px;padding:32px;max-width:1450px}section{background:#1a2432;border:1px solid #303e50;border-radius:12px;padding:22px;margin:18px 0}h2{margin-top:0}label{display:block;color:#b9c8d9;margin:12px 0 6px}input,select,textarea{width:100%;background:#101822;color:white;border:1px solid #435267;border-radius:6px;padding:11px;font:inherit}textarea{min-height:90px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.secondary{background:#34465b;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}#poster{position:relative;width:min(100%,360px);margin:auto;background:#142b43;color:white;display:flex;flex-direction:column;justify-content:space-between;padding:8%;overflow:hidden;aspect-ratio:4/5}#poster h2{font-size:clamp(18px,3vw,32px);overflow-wrap:anywhere}#hero{background:#ffffff22;display:grid;place-items:center;flex:1;margin:12px 0;min-height:50px}#safe{position:absolute;inset:14% 12% 23% 7%;border:1px dashed orange;pointer-events:none}#poster b{background:#c8f36b;color:#172219;padding:8px;text-align:center} .muted{color:#a8b7c8} @media(max-width:700px){aside{position:static;width:auto;height:auto}nav{display:flex;overflow:auto}nav button{min-width:130px}main{margin:0;padding:15px}}</style><aside><h1>SIC 360°</h1><small>CREATIVE STRATEGY STUDIO / V2</small><nav id="nav"></nav></aside><main><h1 id="title"></h1><p class="muted" id="desc"></p><div id="content"></div><section><h2>Brief / instrucciones generadas</h2><pre id="result">Configura un proyecto para comenzar.</pre><div class="actions"><button onclick="copyResult()">Copiar instrucciones</button><button class="secondary" onclick="download('brief.txt',result.textContent)">Exportar TXT</button><button class="secondary" onclick="window.open('https://chatgpt.com/','_blank','noopener')">Abrir ChatGPT</button></div><small id="status"></small></section></main><script>
const modules={ 'Proyectos':'Gestiona marcas y conserva sus configuraciones en este navegador.', 'Strategy Lab':'Investigación, motivaciones y posicionamiento.', 'Brand Studio':'Naming, identidad y dirección de arte.', 'Creative Lab':'Conceptos, hooks y copywriting.', 'Social Studio':'Contenido adaptado a cada plataforma.', 'Meta Ads':'Variantes creativas y experimentación.', 'AI Production':'Guiones, storyboard y prompts audiovisuales.', 'Layout Studio':'Previsualización y composición de soportes.', 'Conversion Lab':'Landing, WhatsApp, CRM y seguimiento.', 'Performance':'Calculadora de resultados hipotéticos y auditoría.'};
const specs={ 'Proyectos':[['marca','Marca'],['rubro','Rubro'],['producto','Producto o servicio','area'],['web','Sitio web'],['publico','Público objetivo','area'],['problema','Problema','area'],['beneficio','Beneficio','area'],['diferencia','Diferenciador','area'],['mercado','Mercado'],['precio','Precio'],['presupuesto','Presupuesto CLP'],['referencias','Referencias y restricciones','area']], 'Strategy Lab':[['objetivo','Objetivo',['Leads calificados','Ventas','Reconocimiento','Posicionamiento','Fidelización']],['consciencia','Consciencia',['Determinar','Inconsciente','Problema','Solución','Producto','Muy consciente']],['motivacion','Motivación',['Determinar','Seguridad','Progreso','Control','Libertad','Identidad','Pertenencia','Reconocimiento','Comodidad']],['competencia','Competidores','area']], 'Brand Studio':[['tipoMarca','Proyecto',['Marca nueva','Rediseño','Brandbook']],['estilo','Estética',['Editorial minimalista','Premium','Tecnológica','Orgánica','Swiss','Brutalista','Cinematográfica']],['tono','Tono',['Profesional','Cercano','Disruptivo','Educativo','Emocional']],['colores','Colores y tipografías','area']], 'Creative Lab':[['formula','Fórmula',['Automática','AIDA','PAS','BAB','StoryBrand','STEPPS','SUCCESs']],['tema','Tema creativo','area'],['cta','CTA',['WhatsApp','Landing','Agenda','Compra','Mensaje directo']]], 'Social Studio':[['red','Red',['Instagram','Facebook','TikTok','LinkedIn','YouTube Shorts','Pinterest','WhatsApp']],['formato','Pieza',['Reel','Carrusel','Post','Historia','Calendario 30 días']],['laminas','Láminas',['5','7','10']]], 'Meta Ads':[['metaObjetivo','Objetivo',['Leads','Ventas','Interacción','Reconocimiento','Tráfico']],['destino','Destino',['WhatsApp','Formulario','Landing','Tienda']],['variable','Variable de prueba',['Hook','Protagonista','Primer plano','CTA','Formato']]], 'AI Production':[['duracion','Duración',['8','15','30','60']],['narrativa','Narrativa',['Problema-solución','Demostración','UGC','Autoridad','Cinematográfica','Educativa']],['avatar','Personaje y voz','area']], 'Layout Studio':[['ratio','Formato',['4:5','9:16','1:1','16:9']],['layout','Composición',['Impacto','Producto protagonista','Editorial dividido','Tipográfica','Autoridad']],['titular','Titular'],['subtitulo','Subtítulo'],['boton','CTA gráfico'],['fondo','Color fondo'],['acento','Color acento']], 'Conversion Lab':[['funnel','Funnel',['Lead a WhatsApp','Diagnóstico y agenda','Venta directa','Registro']],['seguimiento','Condiciones y seguimiento','area']], 'Performance':[['inversion','Inversión CLP'],['cpl','Costo por lead'],['tasa','Conversión %'],['ticket','Ticket CLP'],['margen','Margen %']]};
const instructions={'Proyectos':'Entrega brief integral, hipótesis, público, promesa única, mecanismo y plan de trabajo.','Strategy Lab':'Aplica Le Bon, Bernays, Cialdini, Schwartz, Kahneman, Lippmann y Freud críticamente. Entrega investigación, entrevistas, motivaciones, cinco niveles de consciencia y posicionamiento.','Brand Studio':'Propón cinco nombres, tres rutas conceptuales, eslogan, propósito, personalidad, logotipo conceptual, paleta HEX, tipografías, retícula, iconografía, fotografía, aplicaciones y brandbook. No afirmes disponibilidad marcaria.','Creative Lab':'Aplica Berger, Heath y Miller. Entrega tres territorios creativos, veinte hooks y cinco copys con CTA y argumento.','Social Studio':'Entrega textos exactos por pieza y lámina, guiones, portada, composición, jerarquía, accesibilidad, copy y calendario según plataforma.','Meta Ads':'Desarrolla variantes A problema, B demostración, C confianza; primer plano, hook, copy, titular, descripción, CTA, segmento hipotético y prueba de una variable. Incluye métricas y revisión de políticas.','AI Production':'Entrega guion cronometrado, storyboard, prompts Gemini y Flow por clip de máximo 15 segundos, continuidad facial, cámara, iluminación, voz chilena, montaje CapCut. Sin textos inventados ni pantallas en reverso de dispositivos. Para 8 segundos usa una o dos tomas.','Layout Studio':'Entrega maquetación con dimensiones, retícula, jerarquía, tamaños tipográficos, contraste, zonas seguras, posición de logo, imagen, CTA, prompt visual y exportación.','Conversion Lab':'Aplica Eyal, Miller y Cialdini. Diseña landing, flujo de WhatsApp, calificación, CRM, agenda, seguimiento, supervisión humana y privacidad.','Performance':'Aplica Hopkins: hipótesis, pruebas controladas, CPL, CAC, ROAS, margen, calidad de leads y decisiones según datos.'};
let projects={},current='Proyecto 1',data={},active='Proyectos';try{projects=JSON.parse(localStorage.getItem('sicProjects')||'{}');current=localStorage.getItem('sicCurrent')||current;data=projects[current]||{mercado:'Chile',fondo:'#142b43',acento:'#c8f36b',titular:'TU GRAN IDEA',subtitulo:'Beneficio principal',boton:'CONOCE MÁS',inversion:'150000',cpl:'3000',tasa:'10',ticket:'250000',margen:'60'}}catch(e){};const $=id=>document.getElementById(id);function el(tag,txt){let x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;return x}function save(){projects[current]={...data};try{localStorage.setItem('sicProjects',JSON.stringify(projects));localStorage.setItem('sicCurrent',current);$('status').textContent='Guardado localmente'}catch(e){$('status').textContent='No se pudo guardar localmente; exporta JSON.'}}function download(name,txt){let a=el('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function copyResult(){try{await navigator.clipboard.writeText($('result').textContent);$('status').textContent='Copiado'}catch(e){$('status').textContent='Selecciona y copia el texto manualmente'}}function generate(){let fields=Object.values(specs).flat().filter(([k])=>data[k]).map(([k,l])=>l+': '+data[k]).join('\n');$('result').textContent='SIC 360° — '+active+'\n'+fields+'\n\n'+instructions[active]+'\n\nMantén una sola promesa central. Integra los marcos pertinentes de los 15 módulos SIC 360°. Distingue hechos e hipótesis. No inventes precios, resultados, testimonios ni escasez. Considera privacidad y normativa chilena, accesibilidad y políticas vigentes. Verifica especificaciones actuales de plataformas; no garantices alcance algorítmico.';save()}
function render(){ $('title').textContent=active;$('desc').textContent=modules[active];$('nav').replaceChildren();Object.keys(modules).forEach(m=>{let b=el('button',m);b.className=m===active?'active':'';b.onclick=()=>{active=m;render()};$('nav').append(b)});let c=$('content');c.replaceChildren();let s=el('section');c.append(s);if(active==='Proyectos'){let sel=el('select');[...new Set([current,...Object.keys(projects)])].forEach(n=>{let o=el('option',n);o.value=n;sel.append(o)});sel.value=current;sel.onchange=()=>{save();current=sel.value;data={...projects[current]};render()};s.append(sel);let a=el('div');a.className='actions';[['Nuevo proyecto',()=>{let n=prompt('Nombre del proyecto');if(n&&!Object.hasOwn(projects,n)){save();current=n;data={mercado:'Chile'};save();render()}}],['Exportar JSON',()=>{save();download('sic-proyectos.json',JSON.stringify(projects,null,2))}],['Importar JSON',()=>file.click()]].forEach(([t,fn])=>{let b=el('button',t);b.onclick=fn;a.append(b)});let file=el('input');file.type='file';file.accept='.json';file.hidden=true;file.onchange=async()=>{try{let p=JSON.parse(await file.files[0].text());if(!p||Array.isArray(p)||typeof p!=='object'||!Object.values(p).every(v=>v&&typeof v==='object'&&!Array.isArray(v)))throw Error();projects={...projects,...p};current=Object.keys(p)[0]||current;data={...projects[current]};save();render()}catch(e){alert('JSON inválido')}};s.append(a,file)}let g=el('div');g.className='grid';s.append(g);specs[active].forEach(([k,l,t])=>{let w=el('div'),lab=el('label',l),i=el(Array.isArray(t)?'select':t==='area'?'textarea':'input');if(Array.isArray(t)){t.forEach(v=>{let o=el('option',v);o.value=v;i.append(o)});if(!data[k])data[k]=t[0]}i.value=data[k]||'';i.oninput=()=>{data[k]=i.value;save();preview()};w.append(lab,i);g.append(w)});let b=el('button','Generar brief de '+active);b.style.marginTop='20px';b.onclick=generate;s.append(b);if(active==='Layout Studio'){let p=el('section');p.innerHTML='<div id="poster"><small>MARCA / LOGO</small><h2 id="ph"></h2><div id="hero">IMAGEN / PRODUCTO</div><p id="ps"></p><b id="pb"></b><div id="safe"></div></div><p class="muted">Zona segura orientativa, no oficial. Vista conceptual sin imagen final.</p>';c.append(p)}if(active==='Performance'){let p=el('section');p.id='numbers';c.append(p)}preview();generate()}
function preview(){if($('poster')){let p=$('poster');p.style.aspectRatio=(data.ratio||'4:5').replace(':','/');p.style.background=/^#[0-9a-f]{6}$/i.test(data.fondo||'')?data.fondo:'#142b43';$('pb').style.background=/^#[0-9a-f]{6}$/i.test(data.acento||'')?data.acento:'#c8f36b';$('ph').textContent=data.titular||'TU GRAN IDEA';$('ps').textContent=data.subtitulo||'Beneficio';$('pb').textContent=data.boton||'CTA';$('hero').style.display=data.layout==='Tipográfica'?'none':'grid';$('hero').style.width=data.layout==='Editorial dividido'?'55%':'100%';$('hero').style.alignSelf=data.layout==='Editorial dividido'?'flex-end':'center';$('hero').textContent=data.layout==='Producto protagonista'?'PRODUCTO':data.layout==='Autoridad'?'RETRATO PROFESIONAL':'IMAGEN / PRODUCTO';$('safe').style.display=data.ratio==='9:16'?'block':'none'}if($('numbers')){let n=k=>Math.max(0,Number(data[k])||0),i=n('inversion'),l=n('cpl')?i/n('cpl'):0,v=l*Math.min(100,n('tasa'))/100,r=v*n('ticket'),m=r*Math.min(100,n('margen'))/100-i;$('numbers').textContent=`Leads estimados: ${l.toFixed(1)} | Ventas: ${v.toFixed(1)} | Ingresos: $${Math.round(r).toLocaleString('es-CL')} | CAC: ${v?Math.round(i/v):'—'} | ROAS: ${i?(r/i).toFixed(2):'—'} | Contribución tras publicidad: $${Math.round(m).toLocaleString('es-CL')}. Proyección hipotética sin costos fijos ni impuestos.`}}render();</script></html>
