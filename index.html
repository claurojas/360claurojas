let projects={},current='Proyecto 1',data={},active='Proyectos';try{projects=JSON.parse(localStorage.getItem('sicProjects')||'{}');current=localStorage.getItem('sicCurrent')||current;data=projects[current]||{}}catch(e){};const $=id=>document.getElementById(id);function el(tag,txt){let x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;return x}function save(){projects[current]={...data};try{localStorage.setItem('sicProjects',JSON.stringify(projects));localStorage.setItem('sicCurrent',current);$('status').textContent='Guardado localmente'}catch(e){$('status').textContent='No se pudo guardar localmente; exporta JSON.'}}function download(name,txt){let a=el('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function copyResult(){try{await navigator.clipboard.writeText($('result').textContent);$('status').textContent='Copiado'}catch(e){$('status').textContent='Selecciona y copia el texto manualmente'}}function generate(){let fields=Object.values(specs).flat().filter(([k])=>Array.isArray(data[k])?data[k].length:String(data[k]??'').trim()).map(([k,l])=>l+': '+(Array.isArray(data[k])?data[k].join(', '):data[k])).join('\n');$('result').textContent='SIC 360° — '+active+'\n'+fields+'\n\n'+instructions[active]+(['Campaign Planner','Meta Ads','Social Studio','Performance'].includes(active)?'\n\nPLAN TEMPORAL\n'+campaignPlan():'')+'\n\nMantén una sola promesa central. Integra los marcos pertinentes de los 15 módulos SIC 360°. Distingue hechos e hipótesis. No inventes precios, resultados, testimonios ni escasez. Considera privacidad y normativa chilena, accesibilidad y políticas vigentes. Verifica especificaciones actuales de plataformas; no garantices alcance algorítmico.';save()}

t([...vals,v])]:vals.filter(x=>x!==v);save();preview();generate()};row.append(i,document.createTextNode(v));group.append(row)});w.append(group)}else{let i=el(Array.isArray(t)?'select':t==='area'?'textarea':'input');i.id='field-'+k;lab.htmlFor=i.id;if(Array.isArray(t)){let empty=el('option','Seleccionar…');empty.value='';i.append(empty);t.forEach(v=>{let o=el('option',v);o.value=v;i.append(o)})}else{i.placeholder=examples[k]}i.value=data[k]??'';i.oninput=()=>{data[k]=i.value;save();preview();generate()};w.append(i)}g.append(w)});let b=el('button','Generar brief de '+active);b.style.marginTop='20px';b.onclick=generate;s.append(b);if(active==='Layout Studio'){let p=el('section');p.innerHTML='<h2>Previsualizaciones por combinación</h2><div id="previews" class="preview-grid"></div><p class="muted">Ejemplos visuales orientativos, sin imagen final. Zona segura no oficial.</p>' ;c.append(p)}if(active==='Performance'){let p=el('section');p.id='numbers';c.append(p)}if(['Campaign Planner','Meta Ads','Social Studio','Performance'].includes(active)){let p=el('section');p.append(el('h2','Plan temporal de campaña'));let q=el('p');q.id='campaignSummary';q.style.whiteSpace='pre-wrap';p.append(q);c.append(p)}preview();generate()}
