, CAC, ROAS, margen, calidad de leads y decisiones según datos.'};

function campaignPlan(){let type=data.tipoCampana||({'Leads':'Captación de leads','Ventas':'Ventas','Reconocimiento':'Posicionamiento'}[data.metaObjetivo])||'Captación de leads',r=ranges[type]||[14,30],d=Math.max(1,Math.round(Number(data.diasCampana)||r[1])),b=Math.max(0,Number(data.presupuestoCampana)||0),c=Math.max(0,Number(data.costoResultado)||0),cycle=Math.max(0,Number(data.cicloVenta)||0),start=new Date((data.inicioCampana||'')+'T12:00:00'),end=new Date(start);end.setDate(end.getDate()+d-1);let fmt=n=>Math.round(n).toLocaleString('es-CL');return `Tipo: ${type}. Referencia inicial: ${r[0]}–${r[1]} días${type==='Remarketing'?' por ciclo de revisión; continuidad según resultados':''}. Plan elegido: ${d} días. ${Number.isNaN(+start)?'Fecha no definida.':'Inicio: '+start.toLocaleDateString('es-CL')+'; término: '+end.toLocaleDateString('es-CL')+'.'} ${b?'Presupuesto diario promedio: $'+fmt(b/d)+' CLP.':'Presupuesto total pendiente.'} ${b&&c?'Resultados estimados: '+(b/c).toFixed(1)+' (hipótesis).':'Sin estimación de volumen.'}\nFases: días 1–${Math.min(3,d)} control técnico; revisión inicial día ${Math.min(7,d)}; evaluación intermedia día ${Math.ceil(d/2)}; cierre día ${d}. ${cycle?'Considerar '+cycle+' días de ciclo comercial y conversiones tardías.':''} Revisar calidad, volumen, CPL/CPA, CAC y margen antes de escalar, mantener o detener. No declarar ganador por tiempo solamente; evitar cambios innecesarios y detener ante fallas o pérdidas fuera del límite. Rangos orientativos, no garantía ni regla oficial de plataforma.`}

instructions['Research & Knowledge Lab']='Realiza investigación web real si tienes acceso. Busca fuentes primarias, estudios revisados por pares, libros originales y publicaciones profesionales. Para cada fuente indica autor, año, título, DOI o URL verificable, tipo de evidencia, método, muestra, hallazgo, limitaciones y aplicabilidad al proyecto. Distingue teoría, correlación, causalidad, opinión y evidencia comercial. No inventes citas ni afirmes haber leído textos inaccesibles. Contrasta hallazgos contradictorios y separa clásicos de evidencia reciente. Entrega matriz evidencia → hipótesis creativa → prueba → KPI. Si no puedes navegar, declara la limitación y propone búsquedas.';
instructions['Advertising & Graphic Campaign Studio']='Desarrolla brief publicitario, insight como hipótesis, promesa única, tres territorios creativos, concepto rector recomendado con justificación, key visual y sistema gráfico. Para cada medio y pieza seleccionados entrega texto exacto, jerarquía, retícula, composición, paleta HEX, tipografía, fotografía, CTA, dimensiones y adaptación al contexto. Para impresos verifica tamaño, sangrado, perfil CMYK y resolución con proveedor; para vía pública prioriza lectura a distancia. Para digital verifica especificaciones y zonas seguras vigentes. Incluye prompts de imagen sin texto, guiones cuando corresponda, variantes A/B, calendario, presupuesto, KPI, control de calidad y matriz de entregables. Fundamenta decisiones con fuentes verificadas del Research Lab; si faltan, solicita investigación, no inventes referencias. No prometas rendimiento.';

let projects={},current='Proyecto 1',data={},active='Proyectos';try{projects=JSON.parse(localStorage.getItem('sicProjects')||'{}');current=localStorage.getItem('sicCurrent')||current;data=projects[current]||{}}catch(e){};const $=id=>document.getElementById(id);function el(tag,txt){let x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;return x}function save(){projects[current]={...data};try{localStorage.setItem('sicProjects',JSON.stringify(projects));localStorage.setItem('sicCurrent',current);$('status').textContent='Guardado localmente'}catch(e){$('status').textContent='No se pudo guardar localmente; exporta JSON.'}}function download(name,txt){let a=el('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function copyResult(){try{await navigator.clipboard.writeText($('result').textContent);$('status').textContent='Copiado'}catch(e){$('status').textContent='Selecciona y copia el texto manualmente'}}function generate(){let fields=Object.values(specs).flat().filter(([k])=>Array.isArray(data[k])?data[k].length:String(data[k]??'').trim()).map(([k,l])=>l+': '+(Array.isArray(data[k])?data[k].join(', '):data[k])).join('\n');$('result').textContent='SIC 360° — '+active+'\n'+fields+'\n\n'+instructions[active]+(['Campaign Planner','Meta Ads','Social Studio','Performance','Advertising & Graphic Campaign Studio'].includes(active)?'\n\nPLAN TEMPORAL\n'+campaignPlan():'')+'\n\nUsa el registro de evidencia del Research Lab cuando exista; verifica las referencias antes de citarlas. Mantén una sola promesa central. Integra los marcos pertinentes de los 15 módulos SIC 360°. Distingue hechos e hipótesis. No inventes precios, resultados, testimonios ni escasez. Considera privacidad y normativa chilena, accesibilidad y políticas vigentes. Verifica especificaciones actuales de plataformas; no garantices alcance algorítmico.';save()}
function render(){ $('title').textContent=active;$('desc').textContent=modules[active];$('nav').replaceChildren();Object.keys(modules).forEach(m=>{let b=el('button',m);b.className=m===active?'active':'';b.onclick=()=>{active=m;render()};$('nav').append(b)});let c=$('content');c.replaceChildren();let s=el('section');c.append(s);if(active==='Proyectos'){let sel=el('select');[...new Set([current,...Object.keys(projects)])].forEach(n=>{let o=el('option',n);o.value=n;sel.append(o)});sel.value=current;sel.onchange=()=>{save();current=sel.value;data={...projects[current]};render()};s.append(el('label','Proyecto activo — selecciona una marca guardada'),sel);let a=el('div');a.className='actions';[['Nuevo proyecto',()=>{let n=prompt('Nombre del proyecto (ej. Clínica Aurora — campaña de lanzamiento)');if(n&&!Object.hasOwn(projects,n)){save();current=n;data={};save();render()}}],['Exportar JSON',()=>{save();download('sic-proyectos.json',JSON.stringify(projects,null,2))}],['Importar JSON',()=>file.click()]].forEach(([t,fn])=>{let b=el('button',t);b.onclick=fn;a.append(b)});let file=el('input');file.type='file';file.accept='.json';file.hidden=true;file.onchange=async()=>{try{let p=JSON.parse(await file.files[0].text());if(!p||Array.isArray(p)||typeof p!=='object'||!Object.values(p).every(v=>v&&typeof v==='object'&&!Array.isArray(v)))throw Error();projects={...projects,...p};current=Object.keys(p)[0]||current;data={...projects[current]};save();render()}catch(e){alert('JSON inválido')}};s.append(a,file)}let g=el('div');g.className='grid';s.append(g);specs[active].forEach(([k,l,t])=>{let w=el('div'),lab=el('label',l),hint=el('small',examples[k]);hint.className='hint';w.append(lab,hint);if(multiKeys.has(k)){let group=el('div');group.className='choices';group.setAttribute('role','group');group.setAttribute('aria-label',l);t.forEach(v=>{let row=el('label'),i=el('input');i.type='checkbox';i.checked=selected(k).includes(v);i.onchange=()=>{let vals=selected(k);data[k]=i.checked?[...new Set([...vals,v])]:vals.filter(x=>x!==v);save();preview();generate()};row.append(i,document.createTextNode(v));group.append(row)});w.append(group)}else{let i=el(Array.isArray(t)?'select':t==='area'?'textarea':'input');i.id='field-'+k;lab.htmlFor=i.id;if(Array.isArray(t)){let empty=el('option','Seleccionar…');empty.value='';i.append(empty);t.forEach(v=>{let o=el('option',v);o.value=v;i.append(o)})}else{i.placeholder=examples[k]}i.value=data[k]??'';i.oninput=()=>{data[k]=i.value;save();preview();generate()};w.append(i)}g.append(w)});let b=el('button','Generar brief de '+active);b.style.marginTop='20px';b.onclick=generate;s.append(b);if(active==='Research & Knowledge Lab')researchPanel(c);if(active==='Layout Studio'){let p=el('section');p.innerHTML='<h2>Previsualizaciones por combinación</h2><div id="previews" class="preview-grid"></div><p class="muted">Ejemplos visuales orientativos, sin imagen final. Zona segura no oficial.</p>' ;c.append(p)}if(active==='Performance'){let p=el('section');p.id='numbers';c.append(p)}if(['Campaign Planner','Meta Ads','Social Studio','Performance','Advertising & Graphic Campaign Studio'].includes(active)){let p=el('section');p.append(el('h2','Plan temporal de campaña'));let q=el('p');q.id='campaignSummary';q.style.whiteSpace='pre-wrap';p.append(q);c.append(p)}preview();generate()}
function preview(){if($('campaignSummary'))$('campaignSummary').textContent=campaignPlan();if($('previews')){let root=$('previews');root.replaceChildren();let ratios=selected('ratio'),layouts=selected('layout');if(!ratios.length||!layouts.length){root.append(el('p','Selecciona al menos un formato y una composición.'));}for(let ratio of ratios){for(let layout of layouts){let article=el('article'),title=el('h3',ratio+' · '+layout),p=el('div');p.className='poster '+({'Editorial dividido':'split','Producto protagonista':'product','Autoridad':'authority'}[layout]||'');p.style.aspectRatio=ratio.replace(':','/');p.style.background=/^#[0-9a-f]{6}$/i.test(data.fondo||'')?data.fondo:'#142b43';let logo=el('small','MARCA / LOGO'),h=el('h2',data.titular||'Muchos likes. Pocas consultas.'),hero=el('div',layout==='Producto protagonista'?'PRODUCTO':layout==='Autoridad'?'RETRATO PROFESIONAL':'IMAGEN / PRODUCTO'),sub=el('p',data.subtitulo||'Conecta tu web con WhatsApp'),cta=el('b',data.boton||'Solicita tu diagnóstico');hero.className='hero';cta.style.background=/^#[0-9a-f]{6}$/i.test(data.acento||'')?data.acento:'#c8f36b';p.append(logo,h);if(layout!=='Tipográfica')p.append(hero);p.append(sub,cta);if(ratio==='9:16'){let safe=el('div');safe.className='safe';p.append(safe)}article.append(title,p);root.append(article)}}}if($('numbers')){let n=k=>Math.max(0,Number(data[k])||0),i=n('inversion'),l=n('cpl')?i/n('cpl'):0,v=l*Math.min(100,n('tasa'))/100,r=v*n('ticket'),m=r*Math.min(100,n('margen'))/100-i;$('numbers').textContent=`Leads estimados: ${l.toFixed(1)} | Ventas: ${v.toFixed(1)} | Ingresos: $${Math.round(r).toLocaleString('es-CL')} | CAC: ${v?Math.round(i/v):'—'} | ROAS: ${i?(r/i).toFixed(2):'—'} | Contribución tras publicidad: $${Math.round(m).toLocaleString('es-CL')}. Proyección hipotética sin costos fijos ni impuestos.`}}render();</script></html>
